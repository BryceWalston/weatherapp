<!DOCTYPE HTML>
<html lang="en-US">
   <head>
        <title>weather app</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

         <link rel="stylesheet" href="styles.css">



   </head>
   <body>
      <h1>Your Weather, Your Way.</h1>
      <p>enter your city</p>

      <form method="get">

         <input type="text" name="city-text" placeholder="city"/>
         <input type="submit" value="submit">

      </form>

      <script>


         async function getLocation(){
            let URL = "https://geocoding-api.open-meteo.com/v1/search?name=Chicago&count=10&language=en&format=json";

            let response = await fetch(URL);

            let result = await response.text();

            alert(result);
         }

         getLocation();



      </script>




   </body>





</html>
